<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FOUR WALLS · Προσφορά</title><link rel="apple-touch-icon" href="https://four-walls.gr/forms/icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Four Walls"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1C3457">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* shared form chrome: mirrors enhance.html and the other Έντυπα forms */
:root{--navy:#1C3457;--pink:#FF0062;--ink:#242a33;--muted:#6b7280;--line:#d7dce3;--bg:#eef1f5;--ok:#12855b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);}
body{font-family:'Manrope','Segoe UI',Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;padding-bottom:96px;}
.wrap{max-width:860px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 0;}
.apphd{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;}
.apphd img{height:34px;}
.apphd .home{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;border-radius:8px;}
.apphd .home:active{opacity:.7;}
.apphd .wm .n{font-family:'Manrope';font-weight:800;letter-spacing:.12em;font-size:15px;line-height:1;}
.apphd .wm .s{font-family:'Manrope';font-weight:600;letter-spacing:.36em;font-size:7px;color:#ff8bbb;margin-top:3px;}
.apphd .ttl{margin-left:auto;text-align:right;font-weight:700;font-size:13px;max-width:52%;}
.hide{display:none!important;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin-bottom:14px;box-shadow:0 1px 4px rgba(20,30,50,.05);}
.sect{font-family:'Manrope';font-weight:700;color:var(--navy);font-size:13px;letter-spacing:.02em;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
.sect::before{content:"";width:16px;height:4px;border-radius:2px;background:var(--pink);display:inline-block;}
.hintline{font-size:12px;color:var(--muted);margin:8px 2px 0;}
.btn{font:inherit;font-weight:700;font-size:15px;border:none;border-radius:12px;padding:14px 12px;min-height:50px;cursor:pointer;}
.btn.p{background:var(--pink);color:#fff;}
.btn.s{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
.btn:active{transform:translateY(1px);}
.btn[disabled]{opacity:.55;}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:860px;margin:0 auto;z-index:20;}
.bar .btn.p{flex:1;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:30;display:none;}
.toast.on{display:block;}
.toast.ok{background:var(--ok);}.toast.err{background:#b3261e;}
/* chosen record (property / contact) */
.chosen{background:#f5f7fa;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;margin:10px 0 0;position:relative;}
.chosen .c-t{font-weight:800;color:var(--navy);padding-right:70px;}
.chosen .c-s{color:var(--muted);font-size:12.5px;margin-top:2px;padding-right:70px;}
.chosen .c-clear{position:absolute;top:11px;right:12px;color:var(--pink);font-weight:700;font-size:12px;cursor:pointer;}
/* fields */
.fld{margin-top:10px;}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 2px 5px;}
.fld input,.fld textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid #cdd5e0;border-radius:10px;padding:12px 12px;}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,0,98,.12);}
.fld textarea{min-height:104px;resize:vertical;line-height:1.5;}
/* the offer amount is the one number that matters, so give it the weight */
.amt{position:relative;}
.amt input{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:.01em;padding:14px 46px 14px 14px;text-align:right;}
/* a bold dark "0" placeholder reads as a real amount, so keep it faint */
.amt input::placeholder{color:#c6cdd8;font-weight:700;}
.amt .cur{position:absolute;right:15px;bottom:22px;font-size:22px;font-weight:800;color:var(--muted);pointer-events:none;line-height:1;}
.ask{font-size:12.5px;color:var(--muted);margin:8px 2px 0;}
.ask b{color:var(--navy);}
.ask .dn{color:#b3261e;font-weight:700;}
.ask .up{color:var(--ok);font-weight:700;}
/* manual contact (not in the CRM yet) */
.linkbtn{background:none;border:0;padding:6px 2px 0;font:inherit;font-size:12.5px;font-weight:700;color:var(--navy);text-decoration:underline;cursor:pointer;}
#manual[hidden]{display:none;}
/* done */
.done{text-align:center;padding:6px 6px 14px;}
.done .ic{width:56px;height:56px;border-radius:50%;background:#e6f6ec;color:var(--ok);display:flex;align-items:center;justify-content:center;margin:2px auto 12px;font-size:30px;font-weight:800;}
.done h2{color:var(--navy);margin:0 0 8px;font-size:18px;}
.done p{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 6px;}
@media(max-width:640px){.apphd .ttl{max-width:44%;font-size:12px;}}

<div id="form">
	<div class="card">
		<div class="sect">Ακίνητο</div>
		<button class="btn s" id="pickListing" type="button" style="width:100%">Επιλογή ακινήτου από CRM</button>
		<div id="listingBox"></div>
	</div>

	<div class="card">
		<div class="sect">Ενδιαφερόμενος</div>
		<button class="btn s" id="pickContact" type="button" style="width:100%">Επιλογή επαφής από CRM</button>
		<div id="contactBox"></div>
		<button class="linkbtn" id="manualBtn" type="button">Δεν υπάρχει στο CRM;</button>
		<div id="manual" hidden>
			<div class="fld"><label for="mName">Ονοματεπώνυμο</label><input id="mName" type="text" autocomplete="off"></div>
			<div class="fld"><label for="mPhone">Τηλέφωνο</label><input id="mPhone" type="tel" inputmode="tel" autocomplete="off"></div>
			<div class="fld"><label for="mEmail">Email (προαιρετικό)</label><input id="mEmail" type="email" inputmode="email" autocomplete="off"></div>
			<div class="hintline">Θα καταχωρηθεί ως νέα επαφή μαζί με την προσφορά.</div>
		</div>
	</div>

	<div class="card">
		<div class="sect">Προσφορά</div>
		<div class="fld amt"><label for="amount">Ποσό προσφοράς</label><input id="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="cur">€</span></div>
		<div class="ask" id="ask"></div>
		<div class="fld"><label for="notes">Παρατηρήσεις</label><textarea id="notes" placeholder="Όροι, χρόνος ισχύος, τρόπος πληρωμής, τι συζητήθηκε…"></textarea></div>
	</div>
</div>

<div id="ok" class="card done hide">
	<div class="ic">✓</div>
	<h2>Η προσφορά στάλθηκε</h2>
	<p id="okmsg"></p>
	<p>Το <strong>info@four-walls.gr</strong> την καταχωρίζει στο EstatePrime.</p>
	<button class="btn s" id="again" type="button" style="margin-top:10px">Νέα προσφορά</button>
</div>
</div>

<div class="bar" id="bar"><button class="btn p" id="send" type="button">Αποστολή προσφοράς</button></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
	/* No document, no signatures, no PDF: the offer is a message to the
	   office, not a contract. Everything here is one JSON payload for the
	   same /api/forms/submit pipeline the signed έντυπα use, so it also
	   inherits the offline outbox. */
	var listing = null;   // raw record from /api/crm/listings
	var contact = null;   // detail record from /api/crm/contacts/{id}

	function $(id){ return document.getElementById(id); }

	function toast(msg, type){
		var t = $("toast");
		t.className = "toast on " + (type || "");
		t.textContent = msg;
		clearTimeout(t._t);
		t._t = setTimeout(function(){ t.className = "toast " + (type || ""); }, 4600);
	}
	// _crm.fw.js and _outbox.fw.js both look for a page-level toast.
	window.toast = toast;

	/* Greek format: "." thousands (docs/localization.md). Offers are whole
	   euros (nobody offers €150.000,50), so no decimals anywhere. */
	function money(n){
		if (n == null || n === "") return "";
		var num = Math.round(Number(n));
		if (!isFinite(num)) return "";
		return String(num).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " €";
	}
	function digits(s){ return String(s == null ? "" : s).replace(/\D+/g, ""); }

	/* ---------------------------------------------------------- pickers */

	function clearBox(box, onClear){
		box.textContent = "";
		return function(title, sub){
			var d = document.createElement("div"); d.className = "chosen";
			var x = document.createElement("span"); x.className = "c-clear"; x.textContent = "Αφαίρεση";
			x.onclick = onClear;
			var t = document.createElement("div"); t.className = "c-t"; t.textContent = title;
			var s = document.createElement("div"); s.className = "c-s"; s.textContent = sub;
			d.appendChild(x); d.appendChild(t); d.appendChild(s);
			box.appendChild(d);
		};
	}

	function renderListing(){
		var add = clearBox($("listingBox"), function(){ listing = null; renderListing(); });
		if (!listing) { renderAsk(); return; }
		add((listing.code ? listing.code + " · " : "") + (listing.address || "Ακίνητο"),
			[listing.area, listing.size ? listing.size + " τ.μ." : "",
			 listing.hiddenPrice ? "κρυφή τιμή" : money(listing.price)].filter(Boolean).join(" · "));
		renderAsk();
	}

	function renderContact(){
		var add = clearBox($("contactBox"), function(){ contact = null; renderContact(); });
		if (!contact) return;
		add(contact.onomatepwnymo || "Επαφή",
			[contact.phone, contact.email].filter(Boolean).join(" · ") || "χωρίς τηλέφωνο στο CRM");
		// A CRM contact and a hand-typed one are the same slot, so picking one
		// puts the manual fields away rather than leaving two answers open.
		$("manual").hidden = true;
		$("mName").value = ""; $("mPhone").value = ""; $("mEmail").value = "";
	}

	/* Distance from the asking price is the first thing the office asks, so
	   compute it here instead of leaving two numbers to be compared by eye.
	   Hidden-price listings get no comparison: there is nothing to compare,
	   and a fabricated 0% would read as «στην τιμή». */
	function diffPct(amount){
		var ask = listing && !listing.hiddenPrice ? Number(listing.price) : 0;
		if (!(ask > 0) || !(amount > 0)) return "";
		var d = Math.round((amount - ask) / ask * 1000) / 10;
		// Greek decimal comma, and an explicit + so «πάνω από τη ζήτηση» reads
		// as such next to the far more common minus.
		return (d > 0 ? "+" : "") + String(d).replace(".", ",") + "%";
	}

	function renderAsk(){
		var box = $("ask");
		box.textContent = "";
		if (!listing || listing.hiddenPrice || listing.price == null) return;
		var amt = Number(digits($("amount").value));
		var pct = diffPct(amt);
		var html = "Τιμή ζήτησης <b>" + money(listing.price) + "</b>";
		if (pct) html += " · <span class=\"" + (pct.charAt(0) === "-" ? "dn" : "up") + "\">" + pct + "</span>";
		box.innerHTML = html;
	}

	/* ------------------------------------------------------------ amount */

	function onAmount(){
		var el = $("amount");
		var raw = digits(el.value);
		// Reformat as they type; an empty box stays empty rather than "0".
		el.value = raw ? String(Number(raw)).replace(/\B(?=(\d{3})+(?!\d))/g, ".") : "";
		renderAsk();
	}

	/* ------------------------------------------------------------- send */

	function manualContact(){
		var name = $("mName").value.trim();
		if (!name) return null;
		return { onomatepwnymo: name, phone: $("mPhone").value.trim(), email: $("mEmail").value.trim(), id: null };
	}

	function busy(b){ $("send").disabled = b; }

	async function send(){
		var who = contact || manualContact();
		var amount = Number(digits($("amount").value));
		if (!listing) { toast("Διάλεξε ακίνητο.", "err"); return; }
		if (!who) { toast("Διάλεξε επαφή ή γράψε το όνομα του ενδιαφερόμενου.", "err"); return; }
		if (!(amount > 0)) { toast("Συμπλήρωσε το ποσό της προσφοράς.", "err"); return; }

		var ask = listing.hiddenPrice ? null : listing.price;
		var summary = [(listing.code ? listing.code + " · " : "") + (listing.address || "Ακίνητο"),
			money(amount), who.onomatepwnymo].filter(Boolean).join(" · ");

		var payload = {
			form: "prosfora",
			title: "Προσφορά",
			submitted_at: new Date().toISOString(),
			summary: summary,
			data: {
				listing_id: listing.id == null ? "" : String(listing.id),
				listing_code: listing.code || "",
				listing_address: listing.address || "",
				listing_area: listing.area || "",
				listing_size: listing.size == null ? "" : String(listing.size),
				listing_price: ask == null ? "" : money(ask),
				listing_price_num: ask == null ? "" : String(ask),
				contact_id: who.id == null ? "" : String(who.id),
				contact_name: who.onomatepwnymo || "",
				contact_phone: who.phone || "",
				contact_email: who.email || "",
				contact_source: contact ? "crm" : "manual",
				amount: money(amount),
				amount_num: String(amount),
				// Blank rather than a fake 0% when the price is hidden.
				diff_pct: diffPct(amount),
				notes: $("notes").value.trim(),
			},
		};

		try {
			busy(true);
			var res = await FWOutbox.submit(payload, "Προσφορά · " + summary);
			if (window.FWDrafts) FWDrafts.discard(); /* στάλθηκε ή μπήκε στο outbox */
			$("form").classList.add("hide");
			$("bar").classList.add("hide");
			$("ok").classList.remove("hide");
			$("okmsg").textContent = summary;
			if (res.queued) {
				$("okmsg").textContent = summary;
				$("ok").querySelector("h2").textContent = "Η προσφορά αποθηκεύτηκε";
				toast(res.reason === "auth"
					? "Χρειάζεται σύνδεση. Άνοιξε ξανά την εφαρμογή για να σταλεί."
					: "Χωρίς δίκτυο. Θα σταλεί αυτόματα μόλις βρεθεί σύνδεση.", "err");
			} else {
				toast("Στάλθηκε.", "ok");
			}
			window.scrollTo(0, 0);
		} catch (e) {
			console.error(e);
			toast("Αποτυχία. Η προσφορά δεν στάλθηκε ούτε αποθηκεύτηκε.", "err");
		} finally { busy(false); }
	}

	function reset(){
		listing = null; contact = null;
		$("amount").value = ""; $("notes").value = "";
		$("mName").value = ""; $("mPhone").value = ""; $("mEmail").value = "";
		$("manual").hidden = true;
		renderListing(); renderContact();
		$("ok").classList.add("hide");
		$("ok").querySelector("h2").textContent = "Η προσφορά στάλθηκε";
		$("form").classList.remove("hide");
		$("bar").classList.remove("hide");
		/* η άδεια φόρμα είναι η νέα βάση — αλλιώς το autosave θα έσωζε το άδειασμα ως πρόχειρο */
		if (window.FWDrafts) FWDrafts.rebase();
	}

	/* ------------------------------------------------------------- boot */

	function init(){
		$("pickListing").onclick = function(){
			// FWCrm is _crm.fw.js's picker API: same sheet, same 15-min
			// cache and «↻» refresh the signed έντυπα use.
			FWCrm.pickListing(function(l){ listing = l; renderListing(); });
		};
		$("pickContact").onclick = function(){
			FWCrm.pickContact(function(c){ contact = c; renderContact(); });
		};
		$("manualBtn").onclick = function(){
			var m = $("manual");
			m.hidden = !m.hidden;
			if (!m.hidden) { contact = null; renderContact(); $("mName").focus(); }
		};
		$("amount").oninput = onAmount;
		$("send").onclick = send;
		$("again").onclick = reset;

		/* Πρόχειρα (_drafts.fw.js): κρατούν και το επιλεγμένο ακίνητο/επαφή
		   από το CRM — αποθηκεύεται το raw record, όχι ξανά lookup. */
		if (window.FWDrafts) FWDrafts.register({
			form: "prosfora", mount: "#form",
			collect: function(){
				return { listing: listing, contact: contact,
					amount: $("amount").value, notes: $("notes").value,
					mName: $("mName").value, mPhone: $("mPhone").value, mEmail: $("mEmail").value,
					manual: !$("manual").hidden };
			},
			apply: function(d){
				listing = d.listing || null; contact = d.contact || null;
				$("amount").value = d.amount || ""; $("notes").value = d.notes || "";
				$("mName").value = d.mName || ""; $("mPhone").value = d.mPhone || ""; $("mEmail").value = d.mEmail || "";
				$("manual").hidden = !d.manual;
				renderListing(); renderContact(); renderAsk();
			},
			label: function(d){
				return [d.listing && (d.listing.code || d.listing.address),
					(d.contact && d.contact.onomatepwnymo) || d.mName,
					d.amount && d.amount + " €"].filter(Boolean).join(" — ");
			},
		});
	}
	document.addEventListener("DOMContentLoaded", init);
})();
</script>
